management:
  endpoints:
    web:
      exposure:
        include: '*'

logging:
  level:
    org.springframework.vault: DEBUG
    org.springframework.cloud.vault: DEBUG

spring:
  config:
    import: vault://
  cloud:
    vault:
      kv:
        enabled: true
        backend: secrets/kv_v2
        application-name: spring_boot
      uri: http://localhost:8200
      authentication: approle
      app-role:
        role-id: d0d7f440-02fc-24ec-08ce-70255f5fc6ad
        secret-id: bc42d7c9-aa80-142c-4b9a-781e18079385
server:
  port: 8077
